apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadapp-widget
  namespace: lf-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leadapp-widget
  template:
    metadata:
      labels:
        app: leadapp-widget
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: leadsfilter-n1
      containers:
        # Stock nginx 1.31.3 (same version as nginx:alpine) built with ngx_brotli.
        - name: leadapp-widget
          image: fholzer/nginx-brotli:v1.31.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: wwwroot
              mountPath: /app
            # Compressed responses live here. Emptied on restart: the first request per file
            # and encoding pays the compression cost again, every later one is served from it.
            - name: cache
              mountPath: /var/cache/nginx-widget
          # Brotli 11 costs ~2 s for the pair of files and the cache starts empty, so the
          # first visitor after a restart would pay it. Warm it here instead. Must always
          # exit 0 and never hang: a failed or stuck postStart kills the container.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      wget -q -O /dev/null http://127.0.0.1/wapp/v2/wapp.0.js && break
                      sleep 1
                    done
                    for f in wapp.0.js wapp.0.css; do
                      for ae in br gzip; do
                        wget -q -O /dev/null --header="Accept-Encoding: $ae" "http://127.0.0.1/wapp/v2/$f"
                      done
                    done
                    exit 0
      volumes:
        - name: nginx-conf
          configMap:
            name: leadapp-widget-nginx-config
        - name: wwwroot
          hostPath:
            path: /data/lf-prod/leadapp-widget/wwwroot
            type: Directory
        - name: cache
          emptyDir: {}
