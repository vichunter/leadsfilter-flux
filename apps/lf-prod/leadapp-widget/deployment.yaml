apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadapp-widget
  namespace: lf-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leadapp-widget
  template:
    metadata:
      labels:
        app: leadapp-widget
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: leadsfilter-n1
      containers:
        # Stock nginx 1.31.3 (same version as nginx:alpine) built with ngx_brotli.
        - name: leadapp-widget
          image: fholzer/nginx-brotli:v1.31.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: wwwroot
              mountPath: /app
            # Compressed responses live here. Emptied on restart: the first request per file
            # and encoding pays the compression cost again, every later one is served from it.
            - name: cache
              mountPath: /var/cache/nginx-widget

        # Brotli 11 costs ~2 s for the pair of files and the cache starts empty, so the
        # first visitor after a restart would pay it. This warms it once over the shared
        # loopback, then idles - exiting would put it in a restart loop.
        - name: warmup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              log() { echo "warmup: $*"; }
              started=$(date +%s)
              log "waiting for nginx"
              ready=no
              for i in $(seq 1 60); do
                wget -q -O /dev/null http://127.0.0.1/wapp/v2/wapp.0.js && { ready=yes; break; }
                sleep 1
              done
              if [ "$ready" = yes ]; then
                log "nginx is up after $(( $(date +%s) - started ))s"
                for f in wapp.0.js wapp.0.css; do
                  for ae in br gzip; do
                    t=$(date +%s)
                    if wget -q -O /dev/null --header="Accept-Encoding: $ae" "http://127.0.0.1/wapp/v2/$f"; then
                      log "warmed $f as $ae in $(( $(date +%s) - t ))s"
                    else
                      log "FAILED to warm $f as $ae"
                    fi
                  done
                done
                log "done in $(( $(date +%s) - started ))s"
              else
                log "nginx did not answer within 60s, giving up"
              fi
              exec sleep infinity

      volumes:
        - name: nginx-conf
          configMap:
            name: leadapp-widget-nginx-config
        - name: wwwroot
          hostPath:
            path: /data/lf-prod/leadapp-widget/wwwroot
            type: Directory
        - name: cache
          emptyDir: {}
