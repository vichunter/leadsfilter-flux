apiVersion: apps/v1
kind: Deployment
metadata:
  name: leadapp-widget
  namespace: lf-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leadapp-widget
  template:
    metadata:
      labels:
        app: leadapp-widget
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: leadsfilter-n1
      containers:
        # Stock nginx 1.31.3 (same version as nginx:alpine) built with ngx_brotli.
        - name: leadapp-widget
          image: fholzer/nginx-brotli:v1.31.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: wwwroot
              mountPath: /app
            # Compressed responses live here. Emptied on restart: the first request per file
            # and encoding pays the compression cost again, every later one is served from it.
            - name: cache
              mountPath: /var/cache/nginx-widget

        # Brotli 11 costs ~2 s for the pair of files and the cache starts empty, so the
        # first visitor after a restart would pay it. This warms it once over the shared
        # loopback, then idles - exiting would put it in a restart loop.
        - name: warmup
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              log() { echo "warmup: $*"; }

              # busybox date has no %N, so durations come from /proc/uptime, which is
              # monotonic and immune to clock steps. The kernel prints centiseconds,
              # so that is the unit here and the output carries two decimals — a third
              # one would always be 0 and imply precision that does not exist.
              now_cs() {
                read -r up _ < /proc/uptime
                frac=${up#*.}; frac=${frac#0}          # "05" -> "5": a leading zero would be read as octal
                echo $(( ${up%.*} * 100 + ${frac:-0} ))
              }
              # One sample: two calls to now_cs could straddle a tick and split the
              # seconds and fraction parts across different readings.
              since() { d=$(( $(now_cs) - $1 )); printf '%d.%02d' $(( d / 100 )) $(( d % 100 )); }

              started=$(now_cs)
              log "waiting for nginx"
              ready=no
              for i in $(seq 1 60); do
                wget -q -O /dev/null http://127.0.0.1/wapp/v2/wapp.0.js && { ready=yes; break; }
                sleep 1
              done
              if [ "$ready" = yes ]; then
                log "nginx is up after $(since $started)s"
                for f in wapp.0.js wapp.0.css; do
                  for ae in br gzip; do
                    t=$(now_cs)
                    if wget -q -O /dev/null --header="Accept-Encoding: $ae" "http://127.0.0.1/wapp/v2/$f"; then
                      log "warmed $f as $ae in $(since $t)s"
                    else
                      log "FAILED to warm $f as $ae"
                    fi
                  done
                done
                log "done in $(since $started)s"
              else
                log "nginx did not answer within 60s, giving up"
              fi
              exec sleep infinity

      volumes:
        - name: nginx-conf
          configMap:
            name: leadapp-widget-nginx-config
        - name: wwwroot
          hostPath:
            path: /data/lf-prod/leadapp-widget/wwwroot
            type: Directory
        - name: cache
          emptyDir: {}
