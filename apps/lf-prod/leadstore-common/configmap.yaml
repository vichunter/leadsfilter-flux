apiVersion: v1
kind: ConfigMap
metadata:
  name: leadstore-common
  namespace: lf-prod
data:
  # Use Workstation GC instead of Server GC. Server GC allocates a heap per CPU core,
  # which wastes memory in containers. Workstation GC is more memory-efficient.
  DOTNET_GCServer: "false"
  # Aggressiveness of returning unused heap memory back to the OS (0-9).
  # 0 = default (GC keeps memory for future allocations).
  # 9 = most aggressive (returns memory immediately, higher CPU cost for GC).
  # 8 is a good balance for long-running containerized services.
  DOTNET_GCConserveMemory: "8"
  # When physical memory usage exceeds this percentage, GC becomes more aggressive
  # to avoid OOM kills. Applies to the container memory limit (cgroup-aware in .NET 5+).
  # Default is 75. Lowered to 50 to trigger more proactive collection in constrained containers.
  DOTNET_GCHighMemPercent: "50"
  TZ: "America/New_York"
  ASPNETCORE_URLS: "http://+:80"
  Logging__LogLevel__Microsoft.AspNetCore: Information
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
  Geocoder__Url: "http://geocoder"
  ZLenders__Url: "http://zlenders"
  Mail__Host: "smtp-relay"
  Mail__Port: "25"
  Mail__UseSsl: "false"
  Mail__FromAddress: "info@leadsfilter.com"
  Mail__FromName: "LeadsFilter"
  Mailer__Host: "smtp-relay"
  Mailer__Port: "25"
  Mailer__UseSsl: "false"
  Mailer__AdminNotificationAddresses__0: "flowlight@gmail.com"
  Mailer__AdminNotificationAddresses__1: "mihail.lebedev@gmail.com"
  AppSettings__FrontendBaseUrl: "https://leadsfilter.com/portal/"
  AppSettings__FrontendApiBaseUrl: "https://leadsfilter.com/api/"
  # --- Google Ads stats import (leadstore-cron ImportGoogleAdsStats task) ---
  # Non-secret settings. The ad account customer id (digits only, no dashes).
  GoogleAds__CustomerId: "5055597217"
  # Rolling re-pull window: fetch segments.date >= today - LookbackDays (includes today).
  GoogleAds__LookbackDays: "7"
  # true = log the add/update plan hourly but write nothing; flip to "false" for real writes.
  GoogleAds__DryRun: "false"
  # --- Conversion gate (leadapp-api: withhold the Google conversion for off-target states) ---
  # true = decide and log, but still report the conversion; flip to "false" to actually withhold.
  ConversionGate__DryRun: "true"
  # One line per save that had a conversion decision: conversion-gate: lead=.. rule=.. allowed=..
  ConversionGate__Log: "true"
  # A rule is a When (which leads it applies to) plus a Require (what those leads must satisfy).
  # When terms are ANDed and each takes a SINGLE value; a term set against a blank lead field never
  # matches, so every extra term can only shrink the match set. Require__States takes a comma list.
  # Everything compares case-insensitively on trimmed values. With no Rules__* keys the gate is a no-op.
  # AdNetwork: g = search, s = search partners, d = display.
  ConversionGate__Rules__0__When__AdSource: "gcpc"
  ConversionGate__Rules__0__When__AdCampaignId: "10729629253"
  ConversionGate__Rules__0__When__AdNetwork: "g"
  ConversionGate__Rules__0__Require__States: "MN"
  # Note: rule=N in the log is the position in the bound list, not the key number.
  # --- expected in secret 'leadstore' ---
  # (placeholders; secret values override these via envFrom order)
  ConnectionStrings__StoreConnection: ""  # Host=postgres:5432;Database=leadsfilter-prod;Username=...;Password=...
  Geocoder__ApiKey: ""
  ZLenders__ApiKey: ""
  AppSettings__ServiceRoomApiKey: ""
  # Google Ads read-only creds — set in secret 'leadstore' (see docs/google-ads-api-token-setup.md).
  GoogleAds__DeveloperToken: ""
  GoogleAds__ClientId: ""
  GoogleAds__ClientSecret: ""
  GoogleAds__RefreshToken: ""
